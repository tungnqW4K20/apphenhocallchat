services:
  # 1. Backend WebRTC & Socket.io Service on Render
  - type: web
    name: dating-callchat-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true

  # 2. Frontend Web Application on Render (Static Site)
  - type: web
    name: dating-callchat-web
    env: static
    plan: free
    rootDir: frontend-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
