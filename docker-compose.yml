version: '3.8'

services:
  # Backend API & WebRTC Signaling
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dating_backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5001
      - JWT_SECRET=ayar_dating_production_secret_key_2026_super_secure
    ports:
      - "5001:5001"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/public/uploads

  # Frontend Web App with Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: dating_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_uploads:
